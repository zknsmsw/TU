# 提瓦特交通联合 · Nginx 反向代理配置（模板，自定义端口版）
# __DOMAIN__ 是占位符，setup-https.sh 会用真实域名替换。
#
# 端口规划：
#   3001  HTTP   → 301 跳转到 https://__DOMAIN__:3000
#   3000  HTTPS  → 反代到后端 127.0.0.1:3002
# 证书路径由 acme.sh --install-cert 写到 /etc/letsencrypt/live/__DOMAIN__/

# ---------- HTTP 入口：3001，仅做跳转 ----------
server {
    listen 3001;
    listen [::]:3001;            # IPv6（若本机未启用 IPv6，删除本行，否则 nginx -t 会报 Address family not supported）
    server_name __DOMAIN__;
    server_tokens off;
    return 301 https://__DOMAIN__:3000$request_uri;
}

# ---------- HTTPS 入口：3000 ----------
server {
    listen 3000 ssl;
    listen [::]:3000 ssl;        # IPv6（若本机未启用 IPv6，删除本行，否则 nginx -t 会报 Address family not supported）
    http2 on;                    # nginx >= 1.25.1 的新写法（Ubuntu 26.04 满足）
    server_name __DOMAIN__;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 宣传图走 base64 放进 JSON 上传，后端限制 15MB，必须调大，否则上传报 413
    client_max_body_size 16m;

    # 确认 HTTPS 稳定运行几天后再开 HSTS（避免把访问者锁死在 https 上出问题）：
    # add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout   120s;
    }
}
